<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="987" viewBox="0 0 1440 987"><defs></defs><rect width="1440" height="987" fill="#ffffff"/><path d="M0 0H1440A0 0 0 0 1 1440 0V987.44A0 0 0 0 1 1440 987.44H0A0 0 0 0 1 0 987.44V0A0 0 0 0 1 0 0Z" fill="#f7f9fe" /><path d="M142 111.06H145A2 2 0 0 1 147 113.06V116.06A2 2 0 0 1 145 118.06H142A2 2 0 0 1 140 116.06V113.06A2 2 0 0 1 142 111.06Z" fill="#cc00b4" /><path d="M151 111.06H154A2 2 0 0 1 156 113.06V116.06A2 2 0 0 1 154 118.06H151A2 2 0 0 1 149 116.06V113.06A2 2 0 0 1 151 111.06Z" fill="#3c18a8" /><path d="M142 120.06H145A2 2 0 0 1 147 122.06V125.06A2 2 0 0 1 145 127.06H142A2 2 0 0 1 140 125.06V122.06A2 2 0 0 1 142 120.06Z" fill="#00c0d8" /><path d="M151 120.06H154A2 2 0 0 1 156 122.06V125.06A2 2 0 0 1 154 127.06H151A2 2 0 0 1 149 125.06V122.06A2 2 0 0 1 151 120.06Z" fill="#0084d8" /><text x="166" y="123" font-family="Inter" font-size="11" font-weight="600" fill="#3c18a8"  letter-spacing="1.8" xml:space="preserve">A FEW THINGS YOU MIGHT BE WONDERING</text><text x="140" y="189.14" font-family="Outfit" font-size="42" font-weight="500" fill="#001848"  letter-spacing="-1.47" xml:space="preserve">Let’s clear things up.</text><text x="140" y="228.17" font-family="Inter" font-size="14" font-weight="400" fill="#4a5878"   xml:space="preserve">Getting started should feel simple.</text><path d="M672 110H1280A20 20 0 0 1 1300 130V254.06A20 20 0 0 1 1280 274.06H672A20 20 0 0 1 652 254.06V130A20 20 0 0 1 672 110Z" fill="#fcfbff" /><path d="M672 110.5H1280A19.5 19.5 0 0 1 1299.5 130V254.06A19.5 19.5 0 0 1 1280 273.56H672A19.5 19.5 0 0 1 652.5 254.06V130A19.5 19.5 0 0 1 672 110.5Z" fill="none" stroke="#cbbdf2" stroke-opacity="1" stroke-width="1"/><text x="679" y="153.45" font-family="Inter" font-size="14" font-weight="600" fill="#001848"   xml:space="preserve">Who is ChemistTasker for?</text><path d="M1258 133H1258A15 15 0 0 1 1273 148V148A15 15 0 0 1 1258 163H1258A15 15 0 0 1 1243 148V148A15 15 0 0 1 1258 133Z" fill="#3c18a8" /><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" x="1250" y="140"><path d="M5 12h14" stroke="#ffffff" stroke-opacity="1" stroke-width="2"/></svg><text x="679" y="194" font-family="Inter" font-size="13" font-weight="400" fill="#4a5878"   xml:space="preserve">ChemistTasker is built for five roles: owners, pharmacist managers, locum pharmacists,</text><text x="679" y="218.69" font-family="Inter" font-size="13" font-weight="400" fill="#4a5878"   xml:space="preserve">pharmacy staff and explorers (pharmacy students and interns). Each role has a workspace</text><text x="679" y="243.38" font-family="Inter" font-size="13" font-weight="400" fill="#4a5878"   xml:space="preserve">suited to its needs.</text><path d="M672 286.06H1280A20 20 0 0 1 1300 306.06V342.06A20 20 0 0 1 1280 362.06H672A20 20 0 0 1 652 342.06V306.06A20 20 0 0 1 672 286.06Z" fill="#ffffff" /><path d="M672 286.56H1280A19.5 19.5 0 0 1 1299.5 306.06V342.06A19.5 19.5 0 0 1 1280 361.56H672A19.5 19.5 0 0 1 652.5 342.06V306.06A19.5 19.5 0 0 1 672 286.56Z" fill="none" stroke="#e3e8f4" stroke-opacity="1" stroke-width="1"/><text x="679" y="329.52" font-family="Inter" font-size="14" font-weight="600" fill="#001848"   xml:space="preserve">Can I manage more than one pharmacy?</text><path d="M1258 309.06H1258A15 15 0 0 1 1273 324.06V324.06A15 15 0 0 1 1258 339.06H1258A15 15 0 0 1 1243 324.06V324.06A15 15 0 0 1 1258 309.06Z" fill="#f1edfc" /><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#3c18a8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" x="1250" y="316.06"><path d="M5 12h14" stroke="#3c18a8" stroke-opacity="1" stroke-width="2"/><path d="M12 5v14" stroke="#3c18a8" stroke-opacity="1" stroke-width="2"/></svg><path d="M672 374.06H1280A20 20 0 0 1 1300 394.06V493.44A20 20 0 0 1 1280 513.44H672A20 20 0 0 1 652 493.44V394.06A20 20 0 0 1 672 374.06Z" fill="#fcfbff" /><path d="M672 374.56H1280A19.5 19.5 0 0 1 1299.5 394.06V493.44A19.5 19.5 0 0 1 1280 512.94H672A19.5 19.5 0 0 1 652.5 493.44V394.06A19.5 19.5 0 0 1 672 374.56Z" fill="none" stroke="#cbbdf2" stroke-opacity="1" stroke-width="1"/><text x="679" y="417.52" font-family="Inter" font-size="14" font-weight="600" fill="#001848"   xml:space="preserve">How do I find a shift or find talent?</text><path d="M1258 397.06H1258A15 15 0 0 1 1273 412.06V412.06A15 15 0 0 1 1258 427.06H1258A15 15 0 0 1 1243 412.06V412.06A15 15 0 0 1 1258 397.06Z" fill="#3c18a8" /><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" x="1250" y="404.06"><path d="M5 12h14" stroke="#ffffff" stroke-opacity="1" stroke-width="2"/></svg><text x="679" y="458.06" font-family="Inter" font-size="13" font-weight="400" fill="#4a5878"   xml:space="preserve">Choose Find a Shift to open the public shift board, or Find Talent to explore the public</text><text x="679" y="482.75" font-family="Inter" font-size="13" font-weight="400" fill="#4a5878"   xml:space="preserve">talent board. Account registration may be required to apply or connect.</text><path d="M672 525.44H1280A20 20 0 0 1 1300 545.44V581.44A20 20 0 0 1 1280 601.44H672A20 20 0 0 1 652 581.44V545.44A20 20 0 0 1 672 525.44Z" fill="#ffffff" /><path d="M672 525.94H1280A19.5 19.5 0 0 1 1299.5 545.44V581.44A19.5 19.5 0 0 1 1280 600.94H672A19.5 19.5 0 0 1 652.5 581.44V545.44A19.5 19.5 0 0 1 672 525.94Z" fill="none" stroke="#e3e8f4" stroke-opacity="1" stroke-width="1"/><text x="679" y="568.89" font-family="Inter" font-size="14" font-weight="600" fill="#001848"   xml:space="preserve">Can my pharmacy staff use it too?</text><path d="M1258 548.44H1258A15 15 0 0 1 1273 563.44V563.44A15 15 0 0 1 1258 578.44H1258A15 15 0 0 1 1243 563.44V563.44A15 15 0 0 1 1258 548.44Z" fill="#f1edfc" /><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#3c18a8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" x="1250" y="555.44"><path d="M5 12h14" stroke="#3c18a8" stroke-opacity="1" stroke-width="2"/><path d="M12 5v14" stroke="#3c18a8" stroke-opacity="1" stroke-width="2"/></svg><path d="M672 613.44H1280A20 20 0 0 1 1300 633.44V669.44A20 20 0 0 1 1280 689.44H672A20 20 0 0 1 652 669.44V633.44A20 20 0 0 1 672 613.44Z" fill="#ffffff" /><path d="M672 613.94H1280A19.5 19.5 0 0 1 1299.5 633.44V669.44A19.5 19.5 0 0 1 1280 688.94H672A19.5 19.5 0 0 1 652.5 669.44V633.44A19.5 19.5 0 0 1 672 613.94Z" fill="none" stroke="#e3e8f4" stroke-opacity="1" stroke-width="1"/><text x="679" y="656.89" font-family="Inter" font-size="14" font-weight="600" fill="#001848"   xml:space="preserve">Is ChemistTasker a clinical tool?</text><path d="M1258 636.44H1258A15 15 0 0 1 1273 651.44V651.44A15 15 0 0 1 1258 666.44H1258A15 15 0 0 1 1243 651.44V651.44A15 15 0 0 1 1258 636.44Z" fill="#f1edfc" /><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#3c18a8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" x="1250" y="643.44"><path d="M5 12h14" stroke="#3c18a8" stroke-opacity="1" stroke-width="2"/><path d="M12 5v14" stroke="#3c18a8" stroke-opacity="1" stroke-width="2"/></svg><path d="M672 701.44H1280A20 20 0 0 1 1300 721.44V757.44A20 20 0 0 1 1280 777.44H672A20 20 0 0 1 652 757.44V721.44A20 20 0 0 1 672 701.44Z" fill="#ffffff" /><path d="M672 701.94H1280A19.5 19.5 0 0 1 1299.5 721.44V757.44A19.5 19.5 0 0 1 1280 776.94H672A19.5 19.5 0 0 1 652.5 757.44V721.44A19.5 19.5 0 0 1 672 701.94Z" fill="none" stroke="#e3e8f4" stroke-opacity="1" stroke-width="1"/><text x="679" y="744.89" font-family="Inter" font-size="14" font-weight="600" fill="#001848"   xml:space="preserve">Where can I use ChemistTasker?</text><path d="M1258 724.44H1258A15 15 0 0 1 1273 739.44V739.44A15 15 0 0 1 1258 754.44H1258A15 15 0 0 1 1243 739.44V739.44A15 15 0 0 1 1258 724.44Z" fill="#f1edfc" /><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#3c18a8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" x="1250" y="731.44"><path d="M5 12h14" stroke="#3c18a8" stroke-opacity="1" stroke-width="2"/><path d="M12 5v14" stroke="#3c18a8" stroke-opacity="1" stroke-width="2"/></svg><path d="M672 789.44H1280A20 20 0 0 1 1300 809.44V845.44A20 20 0 0 1 1280 865.44H672A20 20 0 0 1 652 845.44V809.44A20 20 0 0 1 672 789.44Z" fill="#ffffff" /><path d="M672 789.94H1280A19.5 19.5 0 0 1 1299.5 809.44V845.44A19.5 19.5 0 0 1 1280 864.94H672A19.5 19.5 0 0 1 652.5 845.44V809.44A19.5 19.5 0 0 1 672 789.94Z" fill="none" stroke="#e3e8f4" stroke-opacity="1" stroke-width="1"/><text x="679" y="832.89" font-family="Inter" font-size="14" font-weight="600" fill="#001848"   xml:space="preserve">Where can I see pricing?</text><path d="M1258 812.44H1258A15 15 0 0 1 1273 827.44V827.44A15 15 0 0 1 1258 842.44H1258A15 15 0 0 1 1243 827.44V827.44A15 15 0 0 1 1258 812.44Z" fill="#f1edfc" /><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#3c18a8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" x="1250" y="819.44"><path d="M5 12h14" stroke="#3c18a8" stroke-opacity="1" stroke-width="2"/><path d="M12 5v14" stroke="#3c18a8" stroke-opacity="1" stroke-width="2"/></svg></svg>